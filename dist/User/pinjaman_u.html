  <!-- Start::Global Function (used by all pages) -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      function isCurrentPage(url) {
        return window.location.href.includes(url);
      }

      if (isCurrentPage("simpanan_u.html")) {
        document.querySelector(".page-responsive").href =
          "../assets/css/pages/simpanan_u.css";
      } else if (isCurrentPage("pinjaman_u.html")) {
        document.querySelector(".page-responsive").href =
          "../assets/css/pages/pinjaman_u.css";
      }
    });
  </script>
  <!-- End::Global Function -->

<body>

  <!-- Start:: header navbar section -->
  <nav class="navbar-user">
    <div class="container container-navbar">
      <div class="navbar-brand">
        <img src="../assets/media/images/Logo.png" alt="Logo">
      </div>
  
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
  
      <div class="navbar-menu" id="navbar-menu">
        <div class="nav-item"><img src="../assets/media/svg/simpanan.svg" class="svg"><a href="simpanan_u.html">Simpanan</a></div>
        <div class="nav-item"><img src="../assets/media/svg/pinjaman.svg" class="svg"><a href="pinjaman_u.html">Pinjaman</a></div>
        <div class="logout" id="logout">
          <img src="../assets/media/svg/log-out.svg" alt="Logout" class="svg"> <a>Logout</a>
        </div>
      </div>
  
    </div>
  </nav>
  
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const hamburger = document.getElementById('hamburger');
      const navbarMenu = document.getElementById('navbar-menu');
      const logout = document.getElementById('logout');
  
      hamburger.addEventListener('click', function () {
        navbarMenu.classList.toggle('navbar-show');
        hamburger.classList.toggle('hamburger--active');
      });
  
      logout.addEventListener('click', function () {
        localStorage.removeItem('user');
        window.location.href = '/Beranda.html';
      });
    });
  </script>
  <!-- End:: header navbar section -->


   
<section class="pinjaman-user-section">
    <div class="container container-pinjaman">
        <div class="table-container">
            <h4>Riwayat Pinjaman Anda</h4>
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Keterangan</th>

                        <th>Lihat Lebih Detail</th>

                </thead>
                <tbody id="pinjamanTableBody"></tbody>
            </table>

            <div id="view" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close" onclick="closeModal('view')">&times;</span>
                    <h4>Detail Pinjaman</h4>
                    <div class="total-pinjaman">
                        <span class="label">Pinjaman :</span>
                        <span class="nominal" id="totalPinjamanModal">Rp 0</span>
                    </div>
                    <table class="detail-pinjaman-table">
                        <thead>
                            <tr>
                                <th>Bulan Ke</th>
                                <th>Keterangan</th>
                                <th>Tanggal</th>
                                <th>Nominal Dibayar</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="cicilanBody"></tbody>
                        <tfoot id="cicilanFooter"></tfoot>
                    </table>
                </div>
            </div>

            <div class="pagination" id="paginationContainer"></div>
        </div>
    </div>
</section>
