{{#> ../partials/template_super-user.html }}
<section class="simpanan-superadmin-section">
    <div class="container container-simpanan">
        <div class="filter-bar">
            <div class="filter-item search-input">
                <img class="icon" src="../assets/media/svg/search.svg" alt="search">
                <input type="text" placeholder="Cari Nama / NIK / No HP">
            </div>
            <div class="filter-item filter-select">
                <input class="date-picker" type="date" placeholder="Tanggal">
            </div>
            <div class="filter-item action-buttons">
                <button class="export-btn">
                    <img src="../assets/media/svg/xls-svgrepo-com (1).svg" alt="export xls">
                    <span>Export XLS</span>
                </button>
                <button class="export-btn">
                    <img src="../assets/media/svg/pdf-svgrepo-com.svg" alt="export pdf">
                    <span>Export PDF</span>
                </button>
            </div>
        </div>

        <div class="table-container">
            <h4>Daftar Anggota</h4>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>NIK</th>
                            <th>Nomor HP</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Okta Sigma</td>
                            <td>12 Apr 2025</td>
                            <td>+62 123456789</td>
                            <td><span class="badge aktif">Aktif</span></td>
                            <td class="aksi">
                                <button title="Lihat">
                                    <img src="../assets/media/svg/eye-svgrepo-com.svg" alt="view">
                                </button>
                                <button title="Edit">
                                    <img src="../assets/media/svg/pencil.svg" alt="edit">
                                </button>
                                <button title="Aktivasi">
                                    <img src="../assets/media/svg/key.svg" alt="activate">
                                </button>
                                <button title="Non-aktif">
                                    <img src="../assets/media/svg/no-svgrepo-com (1).svg" alt="deactivate">
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Budi Santoso</td>
                            <td>15 Mar 2025</td>
                            <td>+62 987654321</td>
                            <td><span class="badge aktif">Aktif</span></td>
                            <td class="aksi">
                                <button title="Lihat">
                                    <img src="../assets/media/svg/eye-svgrepo-com.svg" alt="view">
                                </button>
                                <button title="Edit">
                                    <img src="../assets/media/svg/pencil.svg" alt="edit">
                                </button>
                                <button title="Aktivasi">
                                    <img src="../assets/media/svg/key.svg" alt="activate">
                                </button>
                                <button title="Non-aktif">
                                    <img src="../assets/media/svg/no-svgrepo-com (1).svg" alt="deactivate">
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <button class="pagination-btn">&lt;</button>
                <button class="pagination-btn active">1</button>
                <button class="pagination-btn">2</button>
                <button class="pagination-btn">3</button>
                <button class="pagination-btn">&gt;</button>
            </div>
        </div>
    </div>
</section>
{{/ ../partials/template_super-user.html }}
